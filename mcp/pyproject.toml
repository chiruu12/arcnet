[project]
name = "arcnet-mcp"
version = "0.1.0"
description = "ArcNet MCP server — fleet intel tools over HTTP"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.0.0",
]

[project.scripts]
arcnet-mcp = "arcnet_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arcnet_mcp"]
